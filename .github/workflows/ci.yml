# Host-independent quality gate: runs on every pull request and on main.
# Hosting providers build and deploy separately (see docs/DEPLOYMENT.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:azure-api
      - name: Placeholder report (informational)
        run: npm run audit:placeholders || true
